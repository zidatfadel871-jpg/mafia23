<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الألعاب التفاعلي - المافيا وبرا السالفة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .bg-glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .glow-red {
            box-shadow: 0 0 25px -5px rgba(239, 68, 68, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.4);
        }
        .glow-purple {
            box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.4);
        }
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 6px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 py-3.5 px-4 sticky top-0 z-50 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="goHome()">
            <div class="w-10 h-10 bg-gradient-to-tr from-violet-600 via-purple-500 to-amber-400 rounded-2xl flex items-center justify-center text-white shadow-lg glow-purple">
                <i class="fa-solid fa-gamepad text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-wide bg-gradient-to-r from-violet-400 via-amber-300 to-amber-500 bg-clip-text text-transparent">
                    مركز الألعاب
                </h1>
                <p class="text-[10px] text-slate-400 -mt-1 font-semibold">Game Hub</p>
            </div>
        </div>
        <button onclick="goHome()" class="px-3.5 py-1.5 text-xs font-bold bg-slate-800/80 hover:bg-slate-700 text-slate-300 rounded-xl transition flex items-center gap-1.5 border border-slate-700/60 shadow-inner">
            <i class="fa-solid fa-house text-amber-400"></i>
            <span>الرئيسية</span>
        </button>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center">
        <!-- Dynamic Content Engine -->
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-slate-500 border-t border-slate-900">
        محاكاة ألعاب المافيا وبرا السالفة التفاعلية
    </footer>

    <!-- Application Engine Logic -->
    <script>
        // Global State Management
        let currentGame = null; // 'MAFIA', 'BARRA', 'GUIDE', or null

        // Mafia State
        let mafiaState = {
            step: 'SETUP', // SETUP, PASS_PHONE, REVEAL, ROUND1_VOTE, NIGHT_ACTION, NIGHT_SUMMARY, VOTING, GAME_OVER
            players: ['فضل', 'محمود', 'أسامه', 'طارق', 'عاصم'],
            newPlayerName: '',
            counts: { mafia: 1, doctor: 1, detective: 1 },
            rolesAssignment: [], // { name, role, alive, isManager }
            currentIndex: 0,
            showRoleCard: false,
            managerName: '',
            nightActions: { mafiaKill: '', doctorSave: '', detectiveCheck: '', detectiveResult: null },
            lastNightSummary: { killed: null, saved: false, targetName: '' },
            currentRound: 1,
            winner: null
        };

        // Barra Salfa State
        let barraState = {
            step: 'SETUP', // SETUP, PASS_PHONE, REVEAL, QUESTION_PAIR, EXTRA_QUESTIONS, VOTING, GUESSING, RESULT
            players: ['فضل', 'محمود', 'أسامه', 'طارق'],
            scores: {}, // { 'فضل': 0, 'محمود': 0, ... }
            newPlayerName: '',
            category: 'فواكه',
            secretTopic: 'تفاح',
            imposterIndex: 0,
            currentIndex: 0,
            showRoleCard: false,
            votedPlayer: null,
            guess: '',
            isGuessCorrect: false,
            questionPairs: [],
            currentPairIndex: 0
        };

        const CATEGORIES = {
            'فواكه': ['تفاح', 'موز', 'برتقال', 'مانجو', 'عنب', 'فراولة'],
            'دول عربية': ['مصر', 'السعودية', 'الإمارات', 'الأردن', 'المغرب', 'فلسطين'],
            'أكلات شعبية': ['كبسة', 'شاورما', 'فلافل', 'منسف', 'كشري', 'بيتزا'],
            'حيوانات': ['أسد', 'نمر', 'فيل', 'زرافة', 'قرد', 'صقر']
        };

        // DOM Render Router
        function render() {
            const container = document.getElementById('app-container');
            if (!currentGame) {
                container.innerHTML = renderHomeScreen();
            } else if (currentGame === 'GUIDE') {
                container.innerHTML = renderRulesGuide();
            } else if (currentGame === 'MAFIA') {
                container.innerHTML = renderMafiaEngine();
            } else if (currentGame === 'BARRA') {
                container.innerHTML = renderBarraEngine();
            }
        }

        function goHome() {
            currentGame = null;
            render();
        }

        // ================= HOME SCREEN =================
        function renderHomeScreen() {
            return `
                <div class="space-y-6">
                    <div class="text-center space-y-2">
                        <span class="px-3.5 py-1 bg-gradient-to-r from-violet-500/20 to-purple-500/20 text-violet-300 text-xs font-bold rounded-full border border-violet-500/30 backdrop-blur-md">✨ محاكاة عصرية للألعاب الجماعية</span>
                        <h2 class="text-3xl font-black text-white tracking-tight">اختر اللعبة وابدأ التحدي</h2>
                        <p class="text-xs text-slate-400 font-medium">جلسة أصدقاء مليئة بالغموض، الضحك، والذكاء</p>
                    </div>

                    <div class="grid grid-cols-1 gap-4">
                        <!-- Mafia Game Card -->
                        <div onclick="startMafiaInit()" class="bg-gradient-to-br from-slate-900/90 via-slate-900/60 to-red-950/40 border border-red-500/30 hover:border-red-500/80 p-5 rounded-3xl cursor-pointer transition-all duration-300 transform hover:-translate-y-1 shadow-2xl hover:glow-red group relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-red-600/10 rounded-full blur-xl group-hover:bg-red-600/20 transition-all"></div>
                            <div class="flex items-center justify-between mb-3.5">
                                <div class="w-12 h-12 bg-gradient-to-tr from-red-600 to-rose-400 text-white rounded-2xl flex items-center justify-center text-2xl shadow-lg group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-user-ninja"></i>
                                </div>
                                <span class="text-[11px] font-extrabold bg-red-950/80 text-red-300 border border-red-800/80 px-3 py-1 rounded-full shadow-inner">4-12 لاعبين</span>
                            </div>
                            <h3 class="text-xl font-black text-white group-hover:text-red-400 transition">لعبة المافيا 🕵️‍♂️</h3>
                            <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">اكتشف المافيا قبل طرد المواطنين! تتضمن الليل، نهار التصويت، والنتائج الدقيقة.</p>
                        </div>

                        <!-- Barra Salfa Game Card -->
                        <div onclick="startBarraInit()" class="bg-gradient-to-br from-slate-900/90 via-slate-900/60 to-amber-950/40 border border-amber-500/30 hover:border-amber-500/80 p-5 rounded-3xl cursor-pointer transition-all duration-300 transform hover:-translate-y-1 shadow-2xl hover:glow-amber group relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-amber-600/10 rounded-full blur-xl group-hover:bg-amber-600/20 transition-all"></div>
                            <div class="flex items-center justify-between mb-3.5">
                                <div class="w-12 h-12 bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 rounded-2xl flex items-center justify-center text-2xl shadow-lg group-hover:scale-110 transition-transform font-bold">
                                    <i class="fa-solid fa-mask"></i>
                                </div>
                                <span class="text-[11px] font-extrabold bg-amber-950/80 text-amber-300 border border-amber-800/80 px-3 py-1 rounded-full shadow-inner">3-10 لاعبين</span>
                            </div>
                            <h3 class="text-xl font-black text-white group-hover:text-amber-400 transition">برا السالفة 🤐</h3>
                            <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">مين الشخص اللي مش عارف السالفة؟ اسألوه، صوّتوا عليه، ودعوه يحاول تخمين الكلمة السرية!</p>
                        </div>
                    </div>

                    <button onclick="currentGame='GUIDE'; render();" class="w-full py-3.5 bg-slate-900/90 hover:bg-slate-800/90 border border-slate-800 text-slate-300 rounded-2xl text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-book-open text-amber-400 text-sm"></i>
                        <span>قواعد الألعاب وشروط الفوز</span>
                    </button>
                </div>
            `;
        }

        // ================= RULES & GUIDE SCREEN =================
        function renderRulesGuide() {
            return `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold text-white">دليل قواعد الألعاب</h2>
                        <button onclick="goHome()" class="text-xs text-amber-400 hover:underline">إغلاق</button>
                    </div>

                    <!-- Mafia Guide -->
                    <div class="bg-slate-900 border border-red-900/40 rounded-2xl p-4 space-y-3">
                        <h3 class="text-base font-bold text-red-400 flex items-center gap-2">
                            <i class="fa-solid fa-user-ninja"></i>
                            <span>قواعد لعبة المافيا</span>
                        </h3>
                        <div class="space-y-2 text-xs text-slate-300 leading-relaxed">
                            <p><b>🕵️ الأدوار:</b> مافيا (يغتالون)، طبيب (يعالج ويحمي)، محقق (يكشف الهويات)، ومواطنون.</p>
                            <p><b>🗳️ الجولة الأولى:</b> تصويت مباشر لطرد لاعب واحد دون استخدام قدرات الليل. اللاعب المطرود يستلم الهاتف ويصبح **مدير اللعبة**.</p>
                            <p><b>🌙 الليل:</b> تقوم المافيا باختيار ضحية، والطبيب باختيار شخص لحمايته، والمحقق بالتحقيق عن لاعب ليعرف إن كان مافيا أم لا.</p>
                            <p><b>🏆 شروط الفوز:</b></p>
                            <ul class="list-disc list-inside text-slate-400 pr-2 space-y-1">
                                <li><b>تفوز المافيا:</b> عندما يصبح عدد المافيا مساوياً لعدد المواطنين الأحياء أو أكثر منهم!</li>
                                <li><b>يفوز المواطنون:</b> عندما يتم كشف وطرد جميع أفراد المافيا بالكامل.</li>
                            </ul>
                        </div>
                    </div>

                    <!-- Barra Salfa Guide -->
                    <div class="bg-slate-900 border border-amber-900/40 rounded-2xl p-4 space-y-3">
                        <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                            <i class="fa-solid fa-mask"></i>
                            <span>قواعد لعبة برا السالفة</span>
                        </h3>
                        <div class="space-y-2 text-xs text-slate-300 leading-relaxed">
                            <p><b>🤫 الكلمة السرية:</b> يعرف الجميع الكلمة السرية ما عدا شخص واحد يكون **"برا السالفة"**.</p>
                            <p><b>❓ تحديد الأسئلة:</b> يحدد النظام من يسأل من بالترتيب.</p>
                            <p><b>➕ الأسئلة الإضافية:</b> بعد الأسئلة الرسمية، يمكن طرح أسئلة حرّة لتأكيد الشكوك.</p>
                            <p><b>🎯 التخمين والنقاط:</b> يتم التصويت على الدخيل، وفي حال كشفه يمنح فرصة لتخمين السالفة لسرقة النقاط!</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // ================= MAFIA ENGINE =================
        function startMafiaInit() {
            currentGame = 'MAFIA';
            mafiaState.step = 'SETUP';
            render();
        }

        function renderMafiaEngine() {
            switch(mafiaState.step) {
                case 'SETUP': return renderMafiaSetup();
                case 'PASS_PHONE': return renderMafiaPassPhone();
                case 'REVEAL': return renderMafiaRoleReveal();
                case 'ROUND1_VOTE': return renderMafiaRound1Vote();
                case 'NIGHT_ACTION': return renderMafiaNightAction();
                case 'NIGHT_SUMMARY': return renderMafiaNightSummary();
                case 'VOTING': return renderMafiaVoting();
                case 'GAME_OVER': return renderMafiaGameOver();
                default: return renderMafiaSetup();
            }
        }

        function renderMafiaSetup() {
            return `
                <div class="space-y-4">
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-red-500">إعداد لعبة المافيا</h2>
                        <p class="text-xs text-slate-400">أدخل أسماء اللاعبين واضبط أعداد الأدوار</p>
                    </div>

                    <!-- Add Player Box -->
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex gap-2">
                        <input id="mafia-input" type="text" placeholder="اسم اللاعب..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                        <button onclick="addMafiaPlayer()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg text-xs transition">إضافة</button>
                    </div>

                    <!-- Players Chips -->
                    <div class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-1">
                        ${mafiaState.players.map((p, idx) => `
                            <span class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2">
                                <span>${p}</span>
                                <i onclick="removeMafiaPlayer(${idx})" class="fa-solid fa-xmark text-slate-500 hover:text-red-400 cursor-pointer"></i>
                            </span>
                        `).join('')}
                    </div>

                    <!-- Roles Counter -->
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-3">
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-red-400"><i class="fa-solid fa-user-ninja"></i> المافيا</span>
                            <div class="flex items-center gap-2">
                                <button onclick="changeMafiaRole('mafia', -1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">-</button>
                                <span class="w-4 text-center font-bold">${mafiaState.counts.mafia}</span>
                                <button onclick="changeMafiaRole('mafia', 1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-emerald-400"><i class="fa-solid fa-user-nurse"></i> الطبيب</span>
                            <div class="flex items-center gap-2">
                                <button onclick="changeMafiaRole('doctor', -1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">-</button>
                                <span class="w-4 text-center font-bold">${mafiaState.counts.doctor}</span>
                                <button onclick="changeMafiaRole('doctor', 1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">+</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="font-bold text-sky-400"><i class="fa-solid fa-user-secret"></i> المحقق</span>
                            <div class="flex items-center gap-2">
                                <button onclick="changeMafiaRole('detective', -1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">-</button>
                                <span class="w-4 text-center font-bold">${mafiaState.counts.detective}</span>
                                <button onclick="changeMafiaRole('detective', 1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold">+</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="startMafiaGame()" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition shadow-lg shadow-red-950">
                        توزيع الأدوار وبدء اللعبة 🚀
                    </button>
                </div>
            `;
        }

        function addMafiaPlayer() {
            const input = document.getElementById('mafia-input');
            if (input && input.value.trim()) {
                mafiaState.players.push(input.value.trim());
                input.value = '';
                render();
            }
        }

        function removeMafiaPlayer(idx) {
            if (mafiaState.players.length > 4) {
                mafiaState.players.splice(idx, 1);
                render();
            }
        }

        function changeMafiaRole(role, delta) {
            if (mafiaState.counts[role] + delta >= 0) {
                mafiaState.counts[role] += delta;
                render();
            }
        }

        function startMafiaGame() {
            const totalSpecial = mafiaState.counts.mafia + mafiaState.counts.doctor + mafiaState.counts.detective;
            if (mafiaState.players.length < totalSpecial + 1) {
                alert('عدد اللاعبين غير كافي توزيع الأدوار المحددة!');
                return;
            }

            let pool = [];
            for(let i=0; i<mafiaState.counts.mafia; i++) pool.push('مافيا 👿');
            for(let i=0; i<mafiaState.counts.doctor; i++) pool.push('طبيب 🩺');
            for(let i=0; i<mafiaState.counts.detective; i++) pool.push('محقق 🕵️‍♂️');
            while(pool.length < mafiaState.players.length) pool.push('مواطن 😇');

            pool.sort(() => Math.random() - 0.5);

            mafiaState.rolesAssignment = mafiaState.players.map((p, i) => ({
                name: p,
                role: pool[i],
                alive: true,
                isManager: false
            }));

            mafiaState.currentIndex = 0;
            mafiaState.currentRound = 1;
            mafiaState.step = 'PASS_PHONE';
            render();
        }

        function renderMafiaPassPhone() {
            const currentObj = mafiaState.rolesAssignment[mafiaState.currentIndex];
            return `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-slate-900 border-2 border-red-500/40 rounded-full flex items-center justify-center mx-auto text-3xl text-red-500 animate-pulse">
                        <i class="fa-solid fa-mobile-screen"></i>
                    </div>
                    <div class="space-y-2">
                        <p class="text-xs text-slate-400">مرر الهاتف بحذر للشخص التالي</p>
                        <h2 class="text-2xl font-black text-white">${currentObj.name}</h2>
                    </div>
                    <button onclick="mafiaState.step='REVEAL'; render();" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition shadow-lg">
                        أنا ${currentObj.name} (اكشف دوري) 👁️
                    </button>
                </div>
            `;
        }

        function renderMafiaRoleReveal() {
            const currentObj = mafiaState.rolesAssignment[mafiaState.currentIndex];
            return `
                <div class="text-center space-y-6 py-4">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                        <span class="text-xs text-slate-400">دورك السري هو:</span>
                        <h3 class="text-2xl font-black text-red-400">${currentObj.role}</h3>
                        <p class="text-xs text-slate-400">احفظ دورك جيداً ولا تدع أحداً يراه!</p>
                    </div>

                    <button onclick="nextMafiaReveal()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition">
                        فهمت، اخفِ دوري ومرر الهاتف 🔒
                    </button>
                </div>
            `;
        }

        function nextMafiaReveal() {
            mafiaState.currentIndex++;
            if (mafiaState.currentIndex < mafiaState.rolesAssignment.length) {
                mafiaState.step = 'PASS_PHONE';
            } else {
                mafiaState.step = 'ROUND1_VOTE';
            }
            render();
        }

        function renderMafiaRound1Vote() {
            return `
                <div class="space-y-4">
                    <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl text-center space-y-1">
                        <h3 class="text-sm font-bold text-amber-400">🗳️ تصويت الجولة الأولى</h3>
                        <p class="text-xs text-slate-300">صوتوا لطرد لاعب أول. الشخص المطرود سيتولى إدارة باقي اللعبة!</p>
                    </div>

                    <div class="space-y-2">
                        ${mafiaState.rolesAssignment.map(p => `
                            <button onclick="executeRound1Vote('${p.name}')" class="w-full p-3 bg-slate-900 hover:bg-red-950/40 border border-slate-800 hover:border-red-600 rounded-xl flex justify-between items-center transition">
                                <span class="font-bold text-white text-sm">${p.name}</span>
                                <span class="text-xs bg-red-950 text-red-400 px-2.5 py-1 rounded-md border border-red-900">طرد واستلام 📱</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function executeRound1Vote(targetName) {
            const player = mafiaState.rolesAssignment.find(p => p.name === targetName);
            player.alive = false;
            player.isManager = true;
            mafiaState.managerName = targetName;
            mafiaState.currentRound = 2;

            checkMafiaWinConditions();
            if (mafiaState.step !== 'GAME_OVER') {
                mafiaState.step = 'NIGHT_ACTION';
            }
            render();
        }

        function renderMafiaNightAction() {
            const alivePlayers = mafiaState.rolesAssignment.filter(p => p.alive);
            return `
                <div class="space-y-4">
                    <div class="bg-indigo-950/40 border border-indigo-900/40 p-4 rounded-xl text-center space-y-2">
                        <div class="w-10 h-10 bg-indigo-900/50 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-xl">
                            <i class="fa-solid fa-moon"></i>
                        </div>
                        <h3 class="text-base font-bold text-indigo-300">مرحلة الليل (مدير اللعبة: ${mafiaState.managerName})</h3>
                        <p class="text-xs text-slate-400">قم بإجراء الخيارات الليلية بسرية بحسب تحركات اللاعبين</p>
                    </div>

                    <!-- Mafia Selection -->
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
                        <label class="text-xs font-bold text-red-400 block"><i class="fa-solid fa-skull"></i> من تود المافيا اغتياله؟</label>
                        <select id="mafia-kill-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
                            <option value="">-- اختر الضحية --</option>
                            ${alivePlayers.map(p => `<option value="${p.name}">${p.name}</option>`).join('')}

                        <select id="doctor-save-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
                            <option value="">-- اختر الشخص المعالج --</option>
                            ${alivePlayers.map(p => `<option value="${p.name}">${p.name}</option>`).join('')}

                    </div>

                    <!-- Detective Selection -->
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
                        <label class="text-xs font-bold text-sky-400 block"><i class="fa-solid fa-magnifying-glass"></i> من يود المحقق الكشف عنه؟</label>
                        <select id="detective-check-select" onchange="previewDetectiveCheck(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
                            <option value="">-- اختر المشتبه به --</option>
                            ${alivePlayers.map(p => `<option value="${p.name}">${p.name}</option>`).join('')}
                        </select>
                        <div id="detective-result-preview" class="text-xs text-amber-400 font-bold hidden"></div>
                    </div>

                    <button onclick="processNightResults()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg">
                        إنهاء الليل وتأكيد النتائج 🌅
                    </button>
                    ${renderSpectatorSection(mafiaState.rolesAssignment.filter(p => !p.alive))}
                </div>
            `;
        }

        function previewDetectiveCheck(name) {
            const box = document.getElementById('detective-result-preview');
            if (!name) {
                box.classList.add('hidden');
                return;
            }
            const p = mafiaState.rolesAssignment.find(x => x.name === name);
            const isMafia = p.role.includes('مافيا');
            box.innerHTML = `نتيجة التحقيق السرية للمحقق: <span class="${isMafia ? 'text-red-400' : 'text-emerald-400'}">${isMafia ? 'مافيا 👿' : 'بريء 😇'}</span>`;
            box.classList.remove('hidden');
        }

        function processNightResults() {
            const killTarget = document.getElementById('mafia-kill-select').value;
            const saveTarget = document.getElementById('doctor-save-select').value;

            mafiaState.lastNightSummary.targetName = killTarget;

            if (killTarget && killTarget !== saveTarget) {
                const targetObj = mafiaState.rolesAssignment.find(p => p.name === killTarget);
                if (targetObj) targetObj.alive = false;
                mafiaState.lastNightSummary.killed = killTarget;
                mafiaState.lastNightSummary.saved = false;
            } else if (killTarget && killTarget === saveTarget) {
                mafiaState.lastNightSummary.killed = null;
                mafiaState.lastNightSummary.saved = true;
            } else {
                mafiaState.lastNightSummary.killed = null;
                mafiaState.lastNightSummary.saved = false;
            }

            checkMafiaWinConditions();
            if (mafiaState.step !== 'GAME_OVER') {
                mafiaState.step = 'NIGHT_SUMMARY';
            }
            render();
        }

        function renderMafiaNightSummary() {
            const summary = mafiaState.lastNightSummary;
            return `
                <div class="space-y-6 text-center py-4">
                    <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-sun"></i>
                    </div>

                    <div class="space-y-3">
                        <h3 class="text-xl font-bold text-white">نتائج أحداث الليل 🌅</h3>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3 text-xs">
                            <p class="text-slate-300">
                                <b>محاولة الاغتيال:</b> ${summary.targetName ? summary.targetName : 'لم يتم استهداف أحد'}
                            </p>
                            <p class="${summary.saved ? 'text-emerald-400' : 'text-red-400'} font-bold">
                                <b>نتيجة المعالجة:</b> ${summary.saved ? 'نجح الطبيب في إنقاذ الضحية! 🩺' : 'فشلت المعالجة / لم ينقذ الطبيب الضحية ❌'}
                            </p>
                            <div class="border-t border-slate-800 pt-2">
                                <p class="text-white font-bold">
                                    ${summary.killed ? `اللاعب المقتول: <span class="text-red-400">${summary.killed}</span> 💀` : 'لم يقتل أحد هذه الليلة 🎉'}
                                </p>
                            </div>
                        </div>
                    </div>

                    <button onclick="mafiaState.step='VOTING'; render();" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition">
                        الانتقال لتصويت النهار 🗳️
                    </button>
                    ${renderSpectatorSection(mafiaState.rolesAssignment.filter(p => !p.alive))}
                </div>
            `;
        }

        function renderMafiaVoting() {
            const alivePlayers = mafiaState.rolesAssignment.filter(p => p.alive);
            return `
                <div class="space-y-4">
                    <div class="text-center space-y-1">
                        <h3 class="text-lg font-bold text-amber-400">🗳️ تصويت النهار للطرد</h3>
                        <p class="text-xs text-slate-400">ناقشوا الأحداث واختاروا المشتبه به لطرحه للتصويت والطرد</p>
                    </div>

                    <div class="space-y-2">
                        ${alivePlayers.map(p => `
                            <button onclick="executeMafiaVoting('${p.name}')" class="w-full p-3 bg-slate-900 hover:bg-red-950/40 border border-slate-800 hover:border-red-600 rounded-xl flex justify-between items-center transition">
                                <span class="font-bold text-white text-sm">${p.name}</span>
                                <span class="text-xs text-red-400">صوت لطرد ❌</span>
                            </button>
                        `).join('')}
                    </div>

                    ${renderSpectatorSection(mafiaState.rolesAssignment.filter(p => !p.alive))}
                </div>
            `;
        }

        function executeMafiaVoting(targetName) {
            const p = mafiaState.rolesAssignment.find(x => x.name === targetName);
            p.alive = false;

            checkMafiaWinConditions();
            if (mafiaState.step !== 'GAME_OVER') {
                mafiaState.currentRound++;
                mafiaState.step = 'NIGHT_ACTION';
            }
            render();
        }

        function checkMafiaWinConditions() {
            const alive = mafiaState.rolesAssignment.filter(p => p.alive);
            const mafiaAlive = alive.filter(p => p.role.includes('مافيا'));
            const innocentAlive = alive.filter(p => !p.role.includes('مافيا'));

            if (mafiaAlive.length === 0) {
                mafiaState.winner = 'المواطنون 😇';
                mafiaState.step = 'GAME_OVER';
            } else if (mafiaAlive.length >= innocentAlive.length) {
                mafiaState.winner = 'المافيا 👿';
                mafiaState.step = 'GAME_OVER';
            }
        }

        function renderMafiaGameOver() {
            return `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-3xl animate-bounce">
                        <i class="fa-solid fa-trophy"></i>
                    </div>

                    <div class="space-y-2">
                        <span class="text-xs text-slate-400">نهاية اللعبة</span>
                        <h2 class="text-2xl font-black text-white">الفائز: ${mafiaState.winner}</h2>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2 text-right">
                        <h4 class="text-xs font-bold text-slate-400 mb-2">كشف هويات جميع اللاعبين:</h4>
                        ${mafiaState.rolesAssignment.map(p => `
                            <div class="flex justify-between text-xs py-1 border-b border-slate-800">
                                <span class="text-white">${p.name}</span>
                                <span class="${p.role.includes('مافيا') ? 'text-red-400' : 'text-emerald-400'} font-bold">${p.role}</span>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="goHome()" class="w-full py-3 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl transition">
                        العودة للقائمة الرئيسية 🏠
                    </button>
                </div>
            `;
        }

        function renderSpectatorSection(deadPlayers) {
            if (deadPlayers.length === 0) return '';
            return `
                <div class="mt-4 pt-4 border-t border-slate-900">
                    <details class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-right">
                        <summary class="text-xs font-bold text-slate-400 cursor-pointer flex items-center justify-between">
                            <span>👁️ كشف الأسرار للمراقبين والمقتولين (${deadPlayers.length})</span>
                            <i class="fa-solid fa-chevron-down text-slate-500"></i>
                        </summary>
                        <div class="mt-3 space-y-2 text-xs">
                            ${mafiaState.rolesAssignment.map(p => `
                                <div class="flex justify-between items-center py-1 border-b border-slate-800">
                                    <span class="${p.alive ? 'text-slate-200' : 'text-slate-500 line-through'}">${p.name} ${p.isManager ? '(مدير اللعبة)' : ''}</span>
                                    <span class="${p.role.includes('مافيا') ? 'text-red-400' : 'text-emerald-400'} font-bold">${p.role}</span>
                                </div>
                            `).join('')}
                        </div>
                    </details>
                </div>
            `;
        }

        // ================= BARRA SALFA ENGINE =================
        function startBarraInit() {
            currentGame = 'BARRA';
            barraState.step = 'SETUP';
            barraState.players.forEach(p => {
                if (barraState.scores[p] === undefined) barraState.scores[p] = 0;
            });
            render();
        }

        function renderBarraEngine() {
            switch(barraState.step) {
                case 'SETUP': return renderBarraSetup();
                case 'PASS_PHONE': return renderBarraPassPhone();
                case 'REVEAL': return renderBarraReveal();
                case 'QUESTION_PAIR': return renderBarraQuestionPair();
                case 'EXTRA_QUESTIONS': return renderBarraExtraQuestions();
                case 'VOTING': return renderBarraVoting();
                case 'GUESSING': return renderBarraGuessing();
                case 'RESULT': return renderBarraResult();
                default: return renderBarraSetup();
            }
        }

        function renderBarraSetup() {
            return `
                <div class="space-y-4">
                    <div class="text-center">
                        <h2 class="text-xl font-bold text-amber-500">إعداد برا السالفة</h2>
                        <p class="text-xs text-slate-400">أدخل الأسماء واختر تصنيف الكلمة</p>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex gap-2">
                        <input id="barra-input" type="text" placeholder="اسم اللاعب..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <button onclick="addBarraPlayer()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs transition">إضافة</button>
                    </div>

                    <div class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-1">
                        ${barraState.players.map((p, idx) => `
                            <span class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-2">
                                <span>${p} (${barraState.scores[p] || 0} ن)</span>
                                <i onclick="removeBarraPlayer(${idx})" class="fa-solid fa-xmark text-slate-500 hover:text-amber-400 cursor-pointer"></i>
                            </span>
                        `).join('')}
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2">
                        <label class="text-xs font-bold text-amber-400 block">اختر التصنيف:</label>
                        <select onchange="barraState.category=this.value" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
                            ${Object.keys(CATEGORIES).map(cat => `<option value="${cat}" ${barraState.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                        </select>
                    </div>

                    <button onclick="startBarraGame()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition shadow-lg">
                        بدء اللعبة وتوزيع السالفة 🎲
                    </button>
                </div>
            `;
        }

        function addBarraPlayer() {
            const input = document.getElementById('barra-input');
            if (input && input.value.trim()) {
                const name = input.value.trim();
                barraState.players.push(name);
                barraState.scores[name] = 0;
                input.value = '';
                render();
            }
        }

        function removeBarraPlayer(idx) {
            if (barraState.players.length > 3) {
                const removed = barraState.players.splice(idx, 1)[0];
                delete barraState.scores[removed];
                render();
            }
        }

        function startBarraGame() {
            const list = CATEGORIES[barraState.category];
            barraState.secretTopic = list[Math.floor(Math.random() * list.length)];
            barraState.imposterIndex = Math.floor(Math.random() * barraState.players.length);
            barraState.currentIndex = 0;

            const shuffled = [...barraState.players].sort(() => Math.random() - 0.5);
            barraState.questionPairs = [];
            for (let i = 0; i < shuffled.length; i++) {
                const asker = shuffled[i];
                const target = shuffled[(i + 1) % shuffled.length];
                barraState.questionPairs.push({ asker, target });
            }
            barraState.currentPairIndex = 0;

            barraState.step = 'PASS_PHONE';
            render();
        }

        function renderBarraPassPhone() {
            const name = barraState.players[barraState.currentIndex];
            return `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-slate-900 border-2 border-amber-500/40 rounded-full flex items-center justify-center mx-auto text-3xl text-amber-500 animate-pulse">
                        <i class="fa-solid fa-mobile-screen"></i>
                    </div>
                    <div class="space-y-2">
                        <p class="text-xs text-slate-400">مرر الهاتف للشخص التالي</p>
                        <h2 class="text-2xl font-black text-white">${name}</h2>
                    </div>
                    <button onclick="barraState.step='REVEAL'; render();" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition">
                        أنا ${name} (كشف السالفة) 👁️
                    </button>
                </div>
            `;
        }

        function renderBarraReveal() {
            const isImposter = barraState.currentIndex === barraState.imposterIndex;
            return `
                <div class="text-center space-y-6 py-4">
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                        <span class="text-xs text-slate-400">موقفك في هذه الجولة:</span>
                        <h3 class="text-2xl font-black ${isImposter ? 'text-red-400' : 'text-amber-400'}">
                            ${isImposter ? 'أنت برا السالفة! 🤫' : `السالفة هي: ${barraState.secretTopic}`}
                        </h3>
                        <p class="text-xs text-slate-400">
                            ${isImposter ? 'حاول التظاهر بمعرفة السالفة والتخمين المباشر!' : `التصنيف هو (${barraState.category})`}
                        </p>
                    </div>

                    <button onclick="nextBarraReveal()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition">
                        اخفِ السالفة ومرر الجهاز 🔒
                    </button>
                </div>
            `;
        }

        function nextBarraReveal() {
            barraState.currentIndex++;
            if (barraState.currentIndex < barraState.players.length) {
                barraState.step = 'PASS_PHONE';
            } else {
                barraState.step = 'QUESTION_PAIR';
            }
            render();
        }

        function renderBarraQuestionPair() {
            const pair = barraState.questionPairs[barraState.currentPairIndex];
            const total = barraState.questionPairs.length;
            return `
                <div class="text-center space-y-6 py-4">
                    <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-circle-question"></i>
                    </div>

                    <div class="space-y-3">
                        <span class="text-xs font-bold text-slate-400">سؤال (${barraState.currentPairIndex + 1} من ${total})</span>
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                            <h3 class="text-xl font-bold text-amber-400">${pair.asker} 💬</h3>
                            <p class="text-xs text-slate-400">قم بتوجيه سؤال ذكي ومباشر إلى:</p>
                            <h3 class="text-xl font-bold text-white">${pair.target} 🎯</h3>
                        </div>
                    </div>

                    <button onclick="nextBarraPair()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition shadow-lg">
                        ${barraState.currentPairIndex + 1 < total ? 'السؤال التالي ➡️' : 'الانتقال للأسئلة الإضافية ➕'}
                    </button>
                </div>
            `;
        }

        function nextBarraPair() {
            barraState.currentPairIndex++;
            if (barraState.currentPairIndex < barraState.questionPairs.length) {
                render();
            } else {
                barraState.step = 'EXTRA_QUESTIONS';
                render();
            }
        }

        function renderBarraExtraQuestions() {
            return `
                <div class="text-center space-y-6 py-4">
                    <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-comments font-bold"></i>
                    </div>

                    <div class="space-y-2">
                        <h3 class="text-xl font-bold text-white">أسئلة إضافية ومناقشة حرّة 💬</h3>
                        <p class="text-xs text-slate-300 leading-relaxed px-2">
                            هل يريد أي لاعب طرح سؤال إضافي لاختبار الشكوك قبل بدء التصويت؟
                        </p>
                    </div>

                    <div class="space-y-3">
                        <button onclick="barraState.step='VOTING'; render();" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl transition shadow-lg">
                            الانتقال للتصويت لكشف الدخيل 🗳️
                        </button>
                    </div>
                </div>
            `;
        }

        function renderBarraVoting() {
            return `
                <div class="space-y-4">
                    <div class="text-center space-y-1">
                        <h3 class="text-lg font-bold text-amber-400">🗳️ التصويت على الدخيل</h3>
                        <p class="text-xs text-slate-400">من تعتقدون أنه الشخص الذي برا السالفة؟</p>
                    </div>

                    <div class="space-y-2">
                        ${barraState.players.map((p, idx) => `
                            <button onclick="executeBarraVoting(${idx})" class="w-full p-3 bg-slate-900 hover:bg-amber-950/40 border border-slate-800 hover:border-amber-600 rounded-xl flex justify-between items-center transition">
                                <span class="font-bold text-white text-sm">${p}</span>
                                <span class="text-xs text-amber-400">تصويت ❌</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function executeBarraVoting(votedIdx) {
            barraState.votedPlayer = barraState.players[votedIdx];
            barraState.step = 'GUESSING';
            render();
        }

        function renderBarraGuessing() {
            const votedName = barraState.votedPlayer;
            const choices = CATEGORIES[barraState.category];

            return `
                <div class="space-y-5 text-center">
                    <div class="bg-gradient-to-r from-amber-950/40 via-purple-950/40 to-slate-900 border border-amber-500/40 p-4 rounded-3xl space-y-2 glow-amber">
                        <span class="px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full text-[11px] font-bold border border-amber-500/30">مرحلة التخمين 🎯</span>
                        <h3 class="text-lg font-black text-white">سلم الهاتف لـ: <span class="text-amber-400">${votedName}</span></h3>
                        <p class="text-xs text-slate-300 leading-relaxed">
                            تم التصويت عليك! اختر الكلمة التي تعتقد أنها **السالفة** لتربح النقاط:
                        </p>
                    </div>

                    <div class="space-y-2.5 max-h-64 overflow-y-auto p-1">
                        ${choices.map(choice => `
                            <button onclick="executeBarraGuess('${choice}')" class="w-full p-3.5 bg-slate-900/90 hover:bg-gradient-to-r hover:from-amber-600 hover:to-amber-500 border border-slate-800 hover:border-amber-400 rounded-2xl text-xs font-bold text-white transition flex justify-between items-center shadow-lg group">
                                <span>${choice}</span>
                                <i class="fa-solid fa-circle-check text-slate-600 group-hover:text-white transition"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function executeBarraGuess(choice) {
            barraState.guess = choice;
            const isVotedImposter = (barraState.votedPlayer === barraState.players[barraState.imposterIndex]);
            barraState.isGuessCorrect = (choice === barraState.secretTopic);

            applyBarraScores(isVotedImposter, barraState.isGuessCorrect);
            barraState.step = 'RESULT';
            render();
        }

        function applyBarraScores(wasImposterCaught, isGuessCorrect) {
            const imposterName = barraState.players[barraState.imposterIndex];

            if (!wasImposterCaught) {
                barraState.scores[imposterName] = (barraState.scores[imposterName] || 0) + 100;
            } else if (isGuessCorrect) {
                barraState.scores[imposterName] = (barraState.scores[imposterName] || 0) + 100;
            } else {
                barraState.players.forEach(p => {
                    if (p !== imposterName) {
                        barraState.scores[p] = (barraState.scores[p] || 0) + 50;
                    }
                });
            }
        }

        function renderBarraResult() {
            const imposterName = barraState.players[barraState.imposterIndex];
            const votedName = barraState.votedPlayer;
            const wasImposterCaught = (votedName === imposterName);

            let winnerText = '';
            if (!wasImposterCaught) {
                winnerText = `خطأ! اخترتم (${votedName}) لكن الدخيل الحقيقي هو (${imposterName}) وفاز للجولة (+100 نقطة)! 🎭`;
            } else if (barraState.isGuessCorrect) {
                winnerText = `صح! اخترتم (${imposterName}) لكنه خمن السالفة صح وفاز بالجولة (+100 نقطة)! 💡`;
            } else {
                winnerText = `كشفتم الدخيل (${imposterName}) ولم يستطع التخمين! فاز باقي اللاعبين (+50 نقطة لكل مواطن)! 🎉`;
            }

            return `
                <div class="text-center space-y-6 py-4">
                    <div class="w-20 h-20 bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 rounded-full flex items-center justify-center mx-auto text-3xl shadow-xl glow-amber animate-bounce">
                        <i class="fa-solid fa-trophy"></i>
                    </div>

                    <div class="space-y-2">
                        <h2 class="text-lg font-black text-white leading-relaxed px-2">${winnerText}</h2>
                        <div class="inline-block bg-slate-900/90 border border-slate-800 px-4 py-2 rounded-2xl">
                            <p class="text-xs text-slate-400">السالفة الحقيقية: <b class="text-amber-400 text-sm font-bold">${barraState.secretTopic}</b></p>
                        </div>
                    </div>

                    <!-- Scoreboard Table -->
                    <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-3xl space-y-2 text-right shadow-2xl">
                        <h4 class="text-xs font-black text-amber-400 mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-chart-simple"></i>
                            <span>جدول النقاط الإجمالي:</span>
                        </h4>
                        ${barraState.players.map(p => `
                            <div class="flex justify-between text-xs py-2 border-b border-slate-800/60">
                                <span class="text-white font-semibold">${p} ${p === imposterName ? '(الدخيل 🤫)' : ''}</span>
                                <span class="font-bold text-amber-400">${barraState.scores[p] || 0} نقطة</span>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex gap-2.5">
                        <button onclick="startBarraGame()" class="flex-1 py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black rounded-2xl transition text-xs shadow-xl">
                            جولة جديدة 🔄
                        </button>
                        <button onclick="goHome()" class="flex-1 py-3.5 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-2xl transition text-xs">
                            الرئيسية 🏠
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
